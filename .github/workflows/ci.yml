name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The frame budget test drives a real browser. Without one it skips itself.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
